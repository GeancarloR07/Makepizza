environment:
  sdk: '>=3.8.0 <4.0.0'

name: makepizza_u
publish_to: "none"
description: App demo MakePizza U (Firebase + Maps + PayPal sandbox + OpenWeather).
version: 1.0.0+1


dependencies:
  flutter:
    sdk: flutter
  # Estado
  flutter_riverpod: ^3.0.3 # Riverpod 3


  # Firebase (FlutterFire)
  firebase_core: ^4.2.0 # Core (obligatorio)
  firebase_auth: ^6.1.1 # Auth email/password
  cloud_firestore: ^6.0.3 # Base de datos NoSQL
  firebase_storage: ^13.0.3 # Imágenes demo (opcional)

  #imagenes
  image_picker: ^1.1.2

  # Maps + ubicación
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0


  # HTTP y utilidades
  http: ^1.1.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  intl: ^0.20.2


  # Iconos (opcional)
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/makepizza_icon_1024.png"
  # Si quieres ícono adaptativo Android:
  

flutter:
  uses-material-design: true
  assets:
  - assets/branding/
  - assets/images/
  - .env